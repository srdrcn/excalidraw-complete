name: Build UI & Push Docker image
on:
 push:
   branches: [ dev ]        # başka branch kullanıyorsan değiştir
jobs:
 docker:
   runs-on: ubuntu-latest
   steps:
   # 1) Fork’unu ve submodule’ü çek
   - name: Checkout repo
     uses: actions/checkout@v4
     with:
       submodules: recursive   # ./excalidraw submodule’unu da alır
   # 2) (İsteğe bağlı) jcobol’daki docker-fix branch’ine geç
   - name: Switch submodule to jcobol fix
     working-directory: excalidraw
     run: |
       git remote add jcobol https://github.com/jcobol/excalidraw || true
       git fetch jcobol
       git checkout 7582_fix_docker_build || true
   # 3) UI’yi ui-build.Dockerfile ile derleyen geçici imaj
   - name: Build temporary UI image
     run: docker build -t ui-builder ./excalidraw -f ui-build.Dockerfile
   # 4) İmaj içindeki /frontend klasörünü çalışma alanına çıkar
   - name: Extract frontend
     run: |
       docker create --name exui ui-builder
       docker cp exui:/frontend ./frontend
       docker rm exui
   # 5) Docker Buildx
   - name: Set up Buildx
     uses: docker/setup-buildx-action@v3
   # 6) Docker Hub’a giriş
   - name: Login to DockerHub
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}
   # 7) Final imajı build + push
   - name: Build & Push
     uses: docker/build-push-action@v5
     with:
       context: .
       push: true
       tags: ${{ secrets.DOCKER_IMAGE }}   # örn: myuser/excalidraw-complete:latest
