# .github/workflows/docker-publish.yml
name: Build UI & Push Docker Image
on:
 push:
   branches: [ dev ]
jobs:
 build-and-push:
   runs-on: ubuntu-latest
   steps:
   - name: Checkout repo (with submodules)
     uses: actions/checkout@v4
     with:
       submodules: recursive
   - name: Build UI-builder image
     working-directory: excalidraw
     run: |
       git checkout tags/v0.17.3
       # Eğer reverse-proxy patch'in varsa:
       git apply ../frontend.patch || true
       # jcobol fix branch'ini de çekmek istersen:
       git remote add jcobol https://github.com/jcobol/excalidraw
       git fetch jcobol
       git checkout 7582_fix_docker_build
       # UI build için Docker image
       docker build -t ui-builder . -f ui-build.Dockerfile
   - name: Extract frontend static files
     run: |
       rm -rf frontend
       mkdir frontend
       docker run --rm \
         -v ${{ github.workspace }}/frontend:/pwd \
         ui-builder \
         cp -r /frontend /pwd
   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3
   - name: Login to DockerHub
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}
   - name: Build and Push final image
     uses: docker/build-push-action@v5
     with:
       context: .
       push: true
       tags: ${{ secrets.DOCKER_IMAGE }}
