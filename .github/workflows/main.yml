name: build-and-push
on:
 push:
   branches: [ main ]          # ihtiyaca göre değiştir
jobs:
 docker:
   runs-on: ubuntu-latest
   steps:
   # 1) Fork + submodule
   - name: Checkout repo
     uses: actions/checkout@v4
     with:
       submodules: recursive
   # 2) (İsteğe bağlı) jcobol fix branch’ine geç
   - name: Switch submodule to jcobol fix
     working-directory: excalidraw
     run: |
       git remote add jcobol https://github.com/jcobol/excalidraw || true
       git fetch jcobol
       git checkout 7582_fix_docker_build || true
   # 3) UI’yi ui-build.Dockerfile ile derleyen geçici imaj
   - name: Build temporary UI image
     run: docker build -t ui-builder ./excalidraw -f ui-build.Dockerfile
   # 4) UI statik dosyalarını çıkar  (/.  → içeriği kopyalar)
   - name: Extract frontend
     run: |
       rm -rf frontend
       docker create --name exui ui-builder
       docker cp exui:/frontend/. ./frontend   # ← İÇERİĞİ kopyala, iç içe klasör yok
       docker rm exui
   # 5) Docker Buildx
   - name: Set up Buildx
     uses: docker/setup-buildx-action@v3
   # 6) Docker Hub login
   - name: Login to DockerHub
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}
   # 7) Final imajı build + push
   - name: Build & Push
     uses: docker/build-push-action@v5
     with:
       context: .
       push: true
       tags: ${{ secrets.DOCKER_IMAGE }}   # örn: myuser/excalidraw-complete:latest
