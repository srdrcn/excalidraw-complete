name: Build UI & Push Docker Image
on:
 push:
   branches: [ dev ]
jobs:
 build-and-push:
   runs-on: ubuntu-latest
   steps:
   # 1) Kod ve submodule'ları çek
   - name: Checkout repo (with submodules)
     uses: actions/checkout@v4
     with:
       submodules: recursive
   # 2) Ön yüzü derleyen temporary imajı build et
   - name: Build UI-builder image
     run: |
       cd excalidraw-complete/excalidraw
       git checkout tags/v0.17.3
       # eğer patch’in varsa:
       # git apply ../frontend.patch
       git remote add jcobol https://github.com/jcobol/excalidraw
       git fetch jcobol
       git checkout 7582_fix_docker_build
       docker build -t excalidraw-ui-build . -f ui-build.Dockerfile
   # 3) Oluşan /frontend klasörünü çek
   - name: Extract frontend static files
     run: |
       # workspace içinde var olacak frontend klasörünü sil/oluştur
       rm -rf $GITHUB_WORKSPACE/frontend
       mkdir -p $GITHUB_WORKSPACE/frontend
       docker run --rm \
         -v $GITHUB_WORKSPACE/frontend:/pwd \
         -it excalidraw-ui-build \
         cp -r /frontend /pwd
   # 4) Docker Buildx’i hazırla
   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3
   # 5) DockerHub’a login ol
   - name: Login to DockerHub
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}
   # 6) Final imajı build et ve pushla
   - name: Build and Push final image
     uses: docker/build-push-action@v5
     with:
       context: .
       push: true
       tags: ${{ secrets.DOCKER_IMAGE }}
