name: Build and Push Excalidraw Complete with Frontend
on:
 push:
   branches:
     - main
jobs:
 build-and-push:
   runs-on: ubuntu-latest
   steps:
   - name: Checkout repo (with submodules)
     uses: actions/checkout@v4
     with:
       submodules: true
   - name: Setup Node.js (for frontend build)
     uses: actions/setup-node@v4
     with:
       node-version: '18'
   - name: Checkout Correct Frontend Branch
     working-directory: excalidraw
     run: |
       git remote add jcobol https://github.com/jcobol/excalidraw
       git fetch jcobol
       git checkout 7582_fix_docker_build
   - name: Install and Build Excalidraw Frontend
     working-directory: excalidraw
     run: |
       npm install
       npm run build
       mkdir -p ../frontend
       cp -r build/* ../frontend/
   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3
   - name: Login to DockerHub
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKER_USERNAME }}
       password: ${{ secrets.DOCKER_PASSWORD }}
   - name: Build and Push Docker Image
     uses: docker/build-push-action@v5
     with:
       context: .
       push: true
       tags: ${{ secrets.DOCKER_IMAGE }}
